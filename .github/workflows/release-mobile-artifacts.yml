name: Build And Release Mobile Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v1.2.0)'
        required: true
        type: string
      release_name:
        description: 'Optional release title'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Unsigned Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Create .env file
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          TMDB_IMAGE_BASE_URL: ${{ secrets.TMDB_IMAGE_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          TMDB_API_KEY=${TMDB_API_KEY}
          TMDB_BASE_URL=${TMDB_BASE_URL:-https://api.themoviedb.org/3}
          TMDB_IMAGE_BASE_URL=${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Prepare unsigned APK artifact
        shell: bash
        run: |
          mkdir -p dist

          apk_candidates=(
            "build/app/outputs/flutter-apk/app-release-unsigned.apk"
            "build/app/outputs/flutter-apk/app-release.apk"
            "android/app/build/outputs/apk/release/app-release-unsigned.apk"
            "android/app/build/outputs/apk/release/app-release.apk"
          )

          apk_path=""
          for candidate in "${apk_candidates[@]}"; do
            if [[ -f "$candidate" ]]; then
              apk_path="$candidate"
              break
            fi
          done

          if [[ -z "$apk_path" ]]; then
            echo "Could not find built APK artifact."
            find build -type f -name "*.apk" -print
            exit 1
          fi

          cp "$apk_path" dist/CineFlix-android-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFlix-android-unsigned
          path: dist/CineFlix-android-unsigned.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create .env file
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          TMDB_IMAGE_BASE_URL: ${{ secrets.TMDB_IMAGE_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          TMDB_API_KEY=${TMDB_API_KEY}
          TMDB_BASE_URL=${TMDB_BASE_URL:-https://api.themoviedb.org/3}
          TMDB_IMAGE_BASE_URL=${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p dist Payload
          cp -R build/ios/Release-iphoneos/Runner.app Payload/
          zip -r dist/CineFlix-ios-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFlix-ios-unsigned
          path: dist/CineFlix-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: CineFlix-android-unsigned
          path: release-assets/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: CineFlix-ios-unsigned
          path: release-assets/ios

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
            release_name="${{ inputs.release_name }}"
          else
            tag="${{ github.ref_name }}"
            release_name=""
          fi

          if [[ -z "$tag" ]]; then
            echo "Missing release tag."
            exit 1
          fi

          if [[ -z "$release_name" ]]; then
            release_name="CineFlix ${tag}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Publish release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/android/CineFlix-android-unsigned.apk
            release-assets/ios/CineFlix-ios-unsigned.ipa
